# Paste into platform/ctfd/seed/challenges.yml (ADD ONLY YOUR OWN BLOCK). Field names match the Stage 2/3 blocks.
# Points are a proposal (Stages 1-3 are 100/150/250); hint costs follow Kosgollage's 0/10%/20% rule -> he sets the final values.
# NO attachment on purpose: players already hold evidence.enc from Stage 4. Attaching it here would let them skip Stage 4.
- name: "Stage 5 - The Flaw in the Lock"
  category: "Cryptography"
  value: 350
  type: standard
  state: visible
  description: |
    The archive recovered from Subject C's device contained one more file, encrypted
    by whoever prepared it. The scheme is home-made, and home-made locks have flaws.

    Break it, read the handler log, and submit the reference code it contains.
    The log also tells you where to go next.

    Flag format: CASE{...}
  flags:
    - type: static
      content: "CASE{ledger_xor_cracked}"
      data: case_insensitive
  hints:
    - { content: "See hints.md #1", cost: 0 }
    - { content: "See hints.md #2", cost: 35 }
    - { content: "See hints.md #3", cost: 70 }
  requirements:
    prerequisites: ["Stage 4 - What Wiping Doesn't Erase"]
