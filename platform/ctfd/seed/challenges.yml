challenges:
  - name: "Stage 1 - The Quiet Poster"
    category: "OSINT"
    value: 100
    type: standard
    state: visible
    description: |
      An anonymous tip says someone in Meridian Freight's Finance team is quietly
      sitting on evidence of a hidden "silent ledger". The only trace is the
      company's internal staff forum (offline mirror attached).
      Identify the insider. Everything you need is inside the package - no internet required.
      Flag format: CASE{STAFFID_HUBCODE_forumhandle}   e.g. CASE{MFC0000_XXX00_username}
      Hub codes are written exactly as on the Locations page; the handle is lowercase.
    files:
      - stages/stage1_osint/dist/stage1_osint_player.zip
    flags:
      - type: static
        content: "CASE{MFC2291_CMB01_larkspur}"
        data: case_insensitive
    hints:
      - { content: "See hints.md #1", cost: 0 }
      - { content: "See hints.md #2", cost: 10 }
      - { content: "See hints.md #3", cost: 20 }
  - name: "Stage 2 - The Drop"
    category: "Networking"
    value: 150
    type: standard
    state: visible
    description: |
      Security captured 90 seconds of traffic from the insider's workstation (10.20.4.17)
      on the morning of 14 March. Most of it is routine. One upload is not.
      Find it, recover what was sent, and submit the reference code it contains.
      You will need your answer from the previous case file.
      Flag format: CASE{...}
    files:
      - stages/stage2_networking/dist/silent_ledger_capture.pcap
    flags:
      - type: static
        content: "CASE{exfil_stream_confirmed_5547}"
        data: case_insensitive
    hints:
      - { content: "See hints.md #1", cost: 0 }
      - { content: "See hints.md #2", cost: 15 }
      - { content: "See hints.md #3", cost: 30 }
    requirements:
      prerequisites: ["Stage 1 - The Quiet Poster"]
  - name: "Stage 3 - The Ledger Portal"
    category: "Web"
    value: 250
    type: standard
    state: visible
    description: |
      The insider's login worked on Meridian Freight's internal Ledger Portal.
      Somewhere in it is the evidence file Compliance sent to the Audit Director.
      Target: http://10.10.10.1:8082
      Use only what the previous case files gave you. Submit the audit reference you find.
      Flag format: CASE{...}
    files: []
    flags:
      - type: static
        content: "CASE{sh4dow_batch_idor_9103}"
        data: case_insensitive
    hints:
      - { content: "You already hold a login. The last case file gave it to you.", cost: 0 }
      - { content: "Open one of your own statements and look at the address bar. What happens if the number changes?", cost: 25 }
      - { content: "Your own statement mentions another one. Statements carry attachments, so check how those are served too.", cost: 50 }
    requirements:
      prerequisites: ["Stage 2 - The Drop"]
  - name: "Stage 4 - What Wiping Doesn't Erase"
    category: "Forensics"
    value: 300
    type: standard
    state: visible
    description: |
     Subject C's personal device was seized shortly after the leak. Nothing was wiped,
     but the user clearly tried to keep one file out ofsight.

     A forensic image of the device is attached. Examine it, recover what was hidden,
     and submit the reference code from the recovery note.
     You will need your answer from the previous case file.

     Tools: a forensic viewer such as Autopsy or FTK Imager, and 7-Zip.
     Flag format: CASE{...}
    files:
    - stages/stage4_forensics/dist/subjectc-image.zip
    flags:
    - type: static
      content: "CASE{h1dden_str3am_ledger_4472}"
      data: case_insensitive
    hints:
    - { content: "See hints.md #1", cost: 0 }
    - { content: "See hints.md #2", cost: 30 }
    - { content: "See hints.md #3", cost: 60 }
    requirements:
      prerequisites: ["Stage 3 - The Ledger Portal"]
  - name: "Stage 5 - The Flaw in the Lock"
    category: "Cryptography"  
    value: 350
    type: standard
    state: visible
    description: |
      The archive recovered from Subject C's device contained one more file, encrypted
      by whoever prepared it. The scheme is home-made, and home-made locks have flaws.

      Break it, read the handler log, and submit the reference code it contains.
      The log also tells you where to go next.

      Flag format: CASE{...}
    flags:
      - type: static
        content: "CASE{ledger_xor_cracked}"
        data: case_insensitive    
    hints:
      - { content: "See hints.md #1", cost: 0 }
      - { content: "See hints.md #2", cost: 35 }
      - { content: "See hints.md #3", cost: 70 }
    requirements:
      prerequisites: ["Stage 4 - What Wiping Doesn't Erase"]  